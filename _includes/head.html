<!-- En-tête HTML : métadonnées, polices, thème, styles.
     Le script de thème est inline et synchrone : il pose
     data-theme avant le premier rendu pour éviter tout flash
     clair/sombre (FOUC). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% if page.noindex %}
<meta name="robots" content="noindex">
{% endif %}

{% capture titre_page %}
  {% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}
{% endcapture %}
<title>{{ titre_page | strip }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">

<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- ── Réseaux sociaux / partage (OG sobre, typographique) ── -->
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ titre_page | strip | xml_escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 160 | xml_escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/og-image.png' | absolute_url }}">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">

<!-- ── Favicon : étoile à 4 branches, fine (Vesper) ── -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<!-- ── Typographie : JetBrains Mono, seule famille du site (thème
     full terminal), self-hosted en woff2 (SPECS §5) ── -->
<link rel="stylesheet" href="{{ '/assets/fonts/jetbrains-mono.css' | relative_url }}">

<!-- ── Couleur de thème navigateur : une par mode ── -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF7F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A1A">

<!-- ── Mathématiques : KaTeX self-hosted (chargé si la page déclare `math: true`) ── -->
{% if page.math %}
<link rel="stylesheet" href="{{ '/assets/katex/katex.min.css' | relative_url }}">
{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- Thème clair/sombre : préférence système, surmontable manuellement.
     La valeur choisie est mémorisée dans localStorage. -->
<script>
  (function () {
    try {
      var pref = localStorage.getItem("vesper-theme");
      var sombre = pref
        ? pref === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = sombre ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
