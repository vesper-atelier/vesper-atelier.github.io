<!-- En-tête du site : une ligne de terminal — prompt, marque, navigation, thème -->
<header class="entete">
  <div class="conteneur entete-interieur">
    <a class="marque" href="{{ '/' | relative_url }}">
      <!-- Étoile à 4 branches, filigrane discret (décorative) -->
      <svg class="marque-etoile" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 0.8 C12.9 7.2 16.8 11.1 23.2 12 C16.8 12.9 12.9 16.8 12 23.2 C11.1 16.8 7.2 12.9 0.8 12 C7.2 11.1 11.1 7.2 12 0.8 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <span class="marque-nom">{{ site.title | downcase }}</span>
    </a>

    <nav class="navigation" aria-label="Navigation principale">
      <a href="{{ '/' | relative_url }}">articles</a>
      <a href="{{ '/about/' | relative_url }}">apropos</a>
      <a href="{{ '/contact/' | relative_url }}">contact</a>
    </nav>

    <button id="bascule-theme" class="bascule-theme" type="button"
            aria-pressed="false" aria-label="Basculer en thème sombre"></button>
  </div>
</header>
