---
# Layout par défaut : squelette de toutes les pages.
# - lang fr, head (meta, OG, polices, thème)
# - lien d'évitement clavier, en-tête, contenu, pied de page
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'fr' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="lien-saut" href="#contenu">Aller au contenu</a>

  {% include header.html %}

  <main id="contenu" class="conteneur" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
